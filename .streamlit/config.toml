# Streamlit theme & server settings for RAIA.
#
# The theme carries the design tokens Streamlit can express natively (fonts,
# palette, radii, borders). raia/ui/theme.css adds what the theme cannot: the
# navy menu bar, white cards on the canvas, and RAIA's own components. Both light
# and dark palettes are defined; people switch with the app menu, and every
# colour pair meets WCAG AA contrast for body text (tests/test_ui.py checks the
# ones RAIA adds).
#
# Fonts are served by the app itself (static/fonts, SIL Open Font License), so no
# page asks a third party for a font: Inter for the interface, Source Serif 4 for
# page titles (theme.css), JetBrains Mono for code.

[theme]
base = "light"
font = "Inter"
headingFont = "Inter"
codeFont = "JetBrains Mono"
baseFontSize = 15
headingFontWeights = [700, 600, 600, 600, 600, 600]
headingFontSizes = ["2.125rem", "1.375rem", "1.1875rem", "1rem", "0.9375rem", "0.875rem"]
baseRadius = "0.5rem"
buttonRadius = "0.5rem"
showWidgetBorder = true
showSidebarBorder = true

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-400-normal.woff2"
weight = 400
style = "normal"
unicodeRange = "U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD"

