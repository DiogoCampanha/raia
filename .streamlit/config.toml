# Streamlit theme & server settings for the hosted RAIA deployment.

[theme]
primaryColor = "#2563eb"        # RAIA blue (Product-layer accent)
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f1f5f9"
textColor = "#0f172a"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
