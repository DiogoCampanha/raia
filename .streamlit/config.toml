[theme.light]
primaryColor = "#1d4ed8"
backgroundColor = "#f2f4f8"
secondaryBackgroundColor = "#f5f7fa"
textColor = "#0f172a"
borderColor = "#dde3ec"
linkColor = "#1d4ed8"
dataframeHeaderBackgroundColor = "#eef1f6"

[theme.dark]
primaryColor = "#3b82f6"
backgroundColor = "#0b1120"
secondaryBackgroundColor = "#172036"
textColor = "#e2e8f0"
borderColor = "#24304a"
linkColor = "#60a5fa"
dataframeHeaderBackgroundColor = "#172036"

[client]
toolbarMode = "minimal"

[server]
headless = true
# Serves static/ at app/static/: the self-hosted fonts.
enableStaticServing = true

[browser]
gatherUsageStats = false
